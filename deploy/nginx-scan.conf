# /etc/nginx/sites-available/scan.basiletti.com  (Debian/Ubuntu layout)
# or /etc/nginx/conf.d/scan.basiletti.com.conf   (Oracle Linux layout)
# After enabling: sudo nginx -t && sudo systemctl reload nginx
# Then HTTPS:     sudo certbot --nginx -d scan.basiletti.com
server {
    listen 80;
    listen [::]:80;
    server_name scan.basiletti.com;

    root /var/www/scan;
    index index.html;

    # The page can load only its own files and can't send data anywhere else.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log off;  # nothing useful to log: decoding happens on the phone

    location / {
        try_files $uri $uri/ =404;
    }

    # Browsers refuse wasm and module scripts served with the wrong type
    # (older mime.types files lack these).
    location ~ \.wasm$ { default_type application/wasm; }
    location ~ \.mjs$  { default_type text/javascript; }

    # Phones should always check for a new service worker.
    location = /sw.js { expires -1; }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/wasm application/manifest+json image/svg+xml;
}
